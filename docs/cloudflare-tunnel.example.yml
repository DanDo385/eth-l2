# Cloudflare Tunnel — eth-l2 staging API (example only; do not commit secrets)
#
# Public hostname: https://api-staging-eth-l2.magro.dev
# Origin on MacBook: http://127.0.0.1:8080  (see config/ports.json → backend.port)
#
# One-time (Cloudflare Zero Trust dashboard or CLI):
#   cloudflared tunnel create eth-l2-staging
#   cloudflared tunnel route dns eth-l2-staging api-staging-eth-l2.magro.dev
#
# Then run (credentials live outside the repo, e.g. ~/.cloudflared/):
#   cloudflared tunnel --config /path/to/this-file.yml run
#
# Or a one-liner without a config file:
#   cloudflared tunnel run --url http://127.0.0.1:8080 <TUNNEL_NAME>

tunnel: <TUNNEL_UUID>
credentials-file: /path/to/credentials.json

ingress:
  - hostname: api-staging-eth-l2.magro.dev
    service: http://127.0.0.1:8080
  - service: http_status:404
